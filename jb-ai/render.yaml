# Render Blueprint for JB AI (web service + managed PostgreSQL).
# Paid database plans include automatic daily backups and point-in-time recovery.
databases:
  - name: jb-ai-db
    plan: basic-256mb
    databaseName: jbai
    user: jbai

services:
  - type: web
    name: jb-ai
    runtime: node
    plan: starter
    rootDir: jb-ai
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: jb-ai-db
          property: connectionString
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true # 256-bit random, base64
      - key: APP_URL
        sync: false # e.g. https://jb-ai.onrender.com or your custom domain
      - key: OWNER_EMAIL
        sync: false # this email becomes OWNER on registration/login
      - key: SMTP_URL
        sync: false # e.g. smtps://user:pass@smtp.example.com:465 (verification + reset emails)
      - key: MAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false # optional: can also be set in Admin → Payments
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
