name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main, fix/player-purple-visual-filter ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish one-click Windows x64
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o dist/publish
          New-Item -ItemType Directory -Force -Path dist/OneClick | Out-Null
          Copy-Item dist/publish/MohammedLab-PC.exe dist/OneClick/MohammedLab-PC.exe

      - name: Verify artifact
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/OneClick -File
          if ($files.Count -ne 1) { throw "Expected one file, found $($files.Count)" }
          if ($files[0].Name -ne 'MohammedLab-PC.exe') { throw "Unexpected output: $($files[0].Name)" }

      - name: Runtime UI capture smoke test
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          function Find-ByName($root, $name) {
            $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
            return $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
          }

          function Invoke-Element($element) {
            if ($null -eq $element) { throw 'UI element not found' }
            $pattern = $element.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $pattern.Invoke()
          }

          $exe = (Resolve-Path 'dist/OneClick/MohammedLab-PC.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 300
              $p.Refresh()
              if ($p.HasExited) { throw "App exited before UI smoke test. Exit code: $($p.ExitCode)" }
            } until ($p.MainWindowHandle -ne 0 -or (Get-Date) -gt $deadline)

            if ($p.MainWindowHandle -eq 0) { throw 'Main window did not appear' }
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle)

            $start = Find-ByName $root 'START CAPTURE'
            Invoke-Element $start

            $deadline = (Get-Date).AddSeconds(12)
            $capturing = $null
            do {
              Start-Sleep -Milliseconds 500
              $p.Refresh()
              if ($p.HasExited) { throw "App exited after START CAPTURE. Exit code: $($p.ExitCode)" }
              $root = [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle)
              $capturing = Find-ByName $root 'CAPTURING'
            } until ($null -ne $capturing -or (Get-Date) -gt $deadline)

            if ($null -eq $capturing) { throw 'CAPTURING state did not appear after START CAPTURE' }
            Write-Host 'START CAPTURE passed and CAPTURING state is visible.'

            New-Item -ItemType Directory -Force -Path dist/smoke | Out-Null
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save((Join-Path $PWD 'dist/smoke/capturing.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()

            $root = [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle)
            $stop = Find-ByName $root 'STOP CAPTURE'
            Invoke-Element $stop
            Start-Sleep -Seconds 2
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle)
            $stopped = Find-ByName $root 'CAPTURE STOPPED'
            if ($null -eq $stopped) { throw 'CAPTURE STOPPED state did not appear after STOP CAPTURE' }
            Write-Host 'STOP CAPTURE passed and CAPTURE STOPPED state is visible.'
          }
          finally {
            $p.Refresh()
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: MohammedLab-PC-OneClick-win-x64
          path: dist/OneClick/MohammedLab-PC.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MohammedLab-PC-UI-Smoke
          path: dist/smoke/capturing.png
          if-no-files-found: ignore
